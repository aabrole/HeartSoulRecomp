plugins {
    id 'com.android.application'
}

// -Phns.asan=true builds with AddressSanitizer, for hunting memory errors on
// a device. Reports go to logcat. Not for normal play: it is slower.
def hnsAsan = (project.findProperty('hns.asan') ?: 'false') == 'true'

android {
    namespace 'com.heartsoul.recomp'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.heartsoul.recomp'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        ndk {
            // 32-bit on purpose: pointers match the GBA's, so the game's data
            // and structs need no 64-bit conversion.
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_ARM_MODE=arm', "-DHNS_ASAN=${hnsAsan ? 'ON' : 'OFF'}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets.main.java.srcDirs += '../SDL2/android-project/app/src/main/java'

    if (hnsAsan) {
        // The sanitizer runtime is preloaded by wrap.sh, which Android runs for
        // debuggable apps. Both must be extracted to disk to be found.
        sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('generated/asanLibs'))
        sourceSets.main.resources.srcDir('src/asan/resources')
        packagingOptions.jniLibs.useLegacyPackaging = true
    }
}

tasks.register('copyAsanRuntime', Copy) {
    // Resolved when the task runs, once the NDK location is known.
    from { fileTree(android.ndkDirectory).matching { include '**/libclang_rt.asan-arm-android.so' }.files }
    into layout.buildDirectory.dir('generated/asanLibs/armeabi-v7a')
}

tasks.named('preBuild').configure {
    if (hnsAsan)
        dependsOn tasks.named('copyAsanRuntime')
}
