plugins {
    id 'com.android.application'
}

// -Phns.asan=true builds with AddressSanitizer, for hunting memory errors on
// a device. Reports go to logcat. Not for normal play: it is slower.
def hnsAsan = (project.findProperty('hns.asan') ?: 'false') == 'true'

// Release builds are signed with the key in android/keystore, described by
// android/keystore.properties. Both stay out of git. Without them a release
// build is left unsigned.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.heartsoul.recomp'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.heartsoul.recomp'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.3.0'

        ndk {
            // Both: devices without 32-bit support (such as the Anbernic
            // RG DS) need arm64-v8a, and Android picks the 64-bit library
            // where both run. Saves are interchangeable between the two.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_ARM_MODE=arm', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', "-DHNS_ASAN=${hnsAsan ? 'ON' : 'OFF'}"
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets.main.java.srcDirs += '../SDL2/android-project/app/src/main/java'

    if (hnsAsan) {
        // The sanitizer runtime is preloaded by wrap.sh, which Android runs for
        // debuggable apps. Both must be extracted to disk to be found.
        sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('generated/asanLibs'))
        sourceSets.main.resources.srcDir('src/asan/resources')
        packagingOptions.jniLibs.useLegacyPackaging = true
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/fontAssets'))
}

tasks.register('copyAsanRuntime') {
    // Resolved when the task runs, once the NDK location is known.
    def outDir = layout.buildDirectory.dir('generated/asanLibs')
    doLast {
        [['armeabi-v7a', 'arm'], ['arm64-v8a', 'aarch64']].each { abi, arch ->
            project.copy {
                from fileTree(android.ndkDirectory).matching { include "**/libclang_rt.asan-${arch}-android.so" }.files
                into outDir.get().dir(abi)
            }
        }
    }
}


// The bottom screen draws text with the game's own fonts. The glyph sheets
// and charmap.txt are copied from the game's sources, and each font's glyph
// widths are read out of src/fonts.c, so nothing is duplicated in git.
tasks.register('copyFontAssets', Sync) {
    def gameRoot = rootProject.file('..')
    def fontsSource = new File(gameRoot, 'src/fonts.c')
    inputs.file(fontsSource)
    def fontNames = ['latin_normal', 'latin_narrow', 'latin_narrower',
                     'latin_small', 'latin_small_narrow', 'latin_small_narrower']
    from(new File(gameRoot, 'graphics/fonts')) {
        include fontNames.collect { it + '.png' }
        into 'fonts'
    }
    from(gameRoot) {
        include 'charmap.txt'
        into 'fonts'
    }
    into layout.buildDirectory.dir('generated/fontAssets')
    doLast {
        def outDir = new File(destinationDir, 'fonts')
        def tables = (fontsSource.getText('UTF-8') =~ /(?s)gFont(\w+?)LatinGlyphWidths\[\]\s*=\s*\{(.*?)\};/)
        int written = 0
        tables.each { match ->
            // gFontSmallNarrowLatinGlyphWidths -> latin_small_narrow.widths
            def name = 'latin_' + match[1].replaceAll(/([a-z])([A-Z])/, '$1_$2').toLowerCase()
            if (!fontNames.contains(name)) {
                return
            }
            def widths = (match[2] =~ /\d+/).collect { it as int }
            if (widths.size() < 256) {
                throw new GradleException("src/fonts.c: ${name} has only ${widths.size()} glyph widths")
            }
            new File(outDir, name + '.widths').bytes = widths.take(256).collect { it as byte } as byte[]
            written++
        }
        fontNames.each {
            if (!new File(outDir, it + '.widths').exists() || !new File(outDir, it + '.png').exists()) {
                throw new GradleException("font ${it} is missing its glyph sheet or its widths in src/fonts.c")
            }
        }
        logger.info("copyFontAssets: ${written} width tables")
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyFontAssets')
    if (hnsAsan)
        dependsOn tasks.named('copyAsanRuntime')
}
